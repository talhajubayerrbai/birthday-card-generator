name: Deploy birthday-card-generator

on:
  workflow_dispatch:
    inputs:
      revision:
        description: "Git ref / SHA to deploy"
        required: false
        default: ""
      udap_run_id:
        description: "UDAP run identifier"
        required: false
        default: ""

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python -c "import app; print('app imports OK')"

  provision:
    name: Provision (Terraform)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - run: echo "provision"
    outputs:
      public_ip: ""
      public_dns: ""
      instance_id: ""

  deploy:
    name: Deploy (Ansible)
    runs-on: ubuntu-latest
    needs: provision
    timeout-minutes: 20
    steps:
      - run: echo "ansible deploy"

  verify:
    name: Verify
    runs-on: ubuntu-latest
    needs: [provision, deploy]
    timeout-minutes: 15
    steps:
      - run: echo "verify"
