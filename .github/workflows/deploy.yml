name: Deploy birthday-card-generator

on:
  workflow_dispatch:
    inputs:
      revision:
        description: "Git ref / SHA to deploy"
        required: false
        default: ""
      udap_run_id:
        description: "UDAP run identifier"
        required: false
        default: ""

jobs:
  # -------------------------------------------------------------------------
  # 1. Test
  # -------------------------------------------------------------------------
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Smoke-test import
        run: python -c "import app; print('app imports OK')"

  # -------------------------------------------------------------------------
  # 2. Provision (Terraform)
  # -------------------------------------------------------------------------
  provision:
    name: Provision
    runs-on: ubuntu-latest
    needs: test
    env:
      AWS_ACCESS_KEY_ID:     ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION:            ${{ vars.AWS_REGION }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision || github.sha }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.5"

      - name: Terraform init
        working-directory: infra
        run: |
          terraform init -input=false -reconfigure \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ vars.TF_STATE_KEY }}" \
            -backend-config="region=${{ vars.AWS_REGION }}"

      - name: Terraform apply
        working-directory: infra
        run: |
          terraform apply -input=false -auto-approve \
            -var="aws_region=${{ vars.AWS_REGION }}" \
            -var="service_name=${{ vars.SERVICE_NAME }}"

      - name: Capture outputs
        id: tf_out
        working-directory: infra
        run: |
          PUBLIC_IP=$(terraform output -raw public_ip)
          PUBLIC_DNS=$(terraform output -raw public_dns)
          echo "public_ip=$PUBLIC_IP"   >> $GITHUB_OUTPUT
          echo "public_dns=$PUBLIC_DNS" >> $GITHUB_OUTPUT

    outputs:
      public_ip:  ${{ steps.tf_out.outputs.public_ip }}
      public_dns: ${{ steps.tf_out.outputs.public_dns }}

  # -------------------------------------------------------------------------
  # 3. Verify  (up to 20 min — user-data bootstrap can be slow on cold t3.micro)
  # -------------------------------------------------------------------------
  verify:
    name: Verify
    runs-on: ubuntu-latest
    needs: provision
    timeout-minutes: 20

    steps:
      - name: Wait for app to answer HTTP 200
        env:
          PUBLIC_IP:  ${{ needs.provision.outputs.public_ip }}
          PUBLIC_DNS: ${{ needs.provision.outputs.public_dns }}
        run: |
          echo "Waiting for http://$PUBLIC_DNS to return 200..."
          DEADLINE=$((SECONDS + 600))
          until curl -sf --max-time 10 "http://$PUBLIC_IP/health" > /dev/null 2>&1; do
            if [ $SECONDS -ge $DEADLINE ]; then
              echo "Timed out after 10 minutes waiting for the app."
              exit 1
            fi
            echo "  not ready yet (${SECONDS}s elapsed) - retrying in 15s"
            sleep 15
          done
          echo "App is up!"
          echo "Live URL: http://$PUBLIC_DNS"
