[defaults]
# Disable host-key checking so the first-connect to a fresh EC2 instance
# does not block waiting for a human to type "yes".
host_key_checking = False
remote_user = ec2-user

[ssh_connection]
# Retry the connection a few times while the instance finishes booting.
retries = 5
# Pipeline runner -> EC2 latency is low; keep-alive avoids idle drops.
ssh_args = -o ServerAliveInterval=30 -o ServerAliveCountMax=10 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
